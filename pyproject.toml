[project]
name = "pcas"
version = "0.1.0"
description = "Predictive Collision Awareness System - learned conflict warning for non-towered airports"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    # Some TartanAviation archives use Deflate64, which the standard library's zipfile
    # cannot read and which bsdtar extracts as padding without erroring.
    "stream-unzip>=0.8",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff==0.16.9",
]
# Training only. Kept out of `dev` so CI does not pull ~2.5 GB of CUDA wheels; the LSTM
# tests skip themselves when torch is absent.
train = [
    "torch>=2.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pcas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
